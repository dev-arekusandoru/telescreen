<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telescreen · design mockup</title>
<style>
:root{
  --bg:#f3ebdd; --surface:#fbf6ec; --surface2:#efe5d2; --ink:#2b2118; --muted:#7f705c; --line:#e2d6c0;
  --a:#c4623f; --b:#5f8a6b; --f:#8a7a66; --accent:#c4623f; --on-accent:#fff;
  --tint:22%; --radius:18px; --shadow:0 2px 0 var(--line), 0 10px 24px -14px rgba(60,40,10,.35);
  --scrim:rgba(43,33,24,.38);
  --display:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --font:ui-sans-serif,'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#17130f; --surface:#211b15; --surface2:#2b241c; --ink:#f1e8d8; --muted:#a09280; --line:#382e24;
  --a:#e58d66; --b:#8fbf9c; --f:#a89a86; --accent:#e58d66; --on-accent:#1b1510;
  --tint:24%; --shadow:0 0 0 1px var(--line), 0 12px 28px -16px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#17130f; --surface:#211b15; --surface2:#2b241c; --ink:#f1e8d8; --muted:#a09280; --line:#382e24;
    --a:#e58d66; --b:#8fbf9c; --f:#a89a86; --accent:#e58d66; --on-accent:#1b1510;
    --tint:24%; --shadow:0 0 0 1px var(--line), 0 12px 28px -16px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.ic{width:1em;height:1em;fill:currentColor;flex:none;display:block}
.app{display:grid;grid-template-columns:84px minmax(0,1fr);height:100vh;height:100dvh}
.app.has-aside{grid-template-columns:84px minmax(0,1fr) 288px}

/* nav rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0;border-right:1px solid var(--line)}
.logo{font-family:var(--display);font-size:30px;font-weight:700;color:var(--accent);margin-bottom:16px;display:grid;place-items:center;width:48px;height:48px}
.nav{width:62px;height:62px;border-radius:16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;transition:.15s}
.nav .ic{font-size:26px}
.nav:active{transform:scale(.96)}
.nav.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.rail .sp{flex:1}

/* main */
main{padding:22px 26px 20px;display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.h-title{display:flex;align-items:center;gap:6px}
h1{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.015em;line-height:1}
.h-sub{color:var(--muted);font-size:14px;margin-top:5px}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface);box-shadow:var(--shadow);transition:.15s}
.circ:active{transform:scale(.94)}
.today-btn{height:40px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.spacer{flex:1}
.wx{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.wx .ic{font-size:24px;color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);transition:.15s;min-height:34px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}

/* people */
.people{display:flex;gap:12px;margin-bottom:14px}
.person{flex:1;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);transition:.2s;cursor:pointer;min-width:0}
.person.off{opacity:.45}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--on-accent);background:var(--c);flex:none}
.pbar{flex:1;min-width:0}
.pbar b{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.pbar b em{font-style:normal;color:var(--muted);font-weight:500}
.track{height:7px;border-radius:9px;background:var(--surface2);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .35s cubic-bezier(.3,.7,.2,1)}

/* calendar */
.cal{flex:1;min-height:0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.cal-head{display:grid;border-bottom:1px solid var(--line);flex:none}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 0 6px;font-family:var(--display);font-size:17px}
.dh small{font-family:var(--font);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dh.today .dn{background:var(--accent);color:var(--on-accent);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:700}
.dh .dn{width:34px;height:34px;display:grid;place-items:center;font-size:20px}
.allday{display:grid;border-bottom:1px solid var(--line);padding:4px 0;min-height:30px;flex:none}
.allday .lbl{font-size:10px;color:var(--muted);text-align:right;padding-right:8px;align-self:center}
.chip{margin:2px 4px;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;position:relative;min-height:0}
.grid{display:grid;position:relative}
.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--H)}
.col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;font-size:12.5px;line-height:1.25;overflow:hidden;
  background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border-left:3px solid var(--c);transition:transform .15s,opacity .2s;text-align:left;display:block}
.ev:active{transform:scale(.98)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ev small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past{opacity:.5}
.now{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3;pointer-events:none}
.now:before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* month */
.month{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;min-height:0}
.mh{padding:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 4px;overflow:hidden;min-height:0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mc .n{font-size:13px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mc.out .n{color:var(--muted);opacity:.5}
.mc.today .n{background:var(--accent);color:var(--on-accent)}
.mc .chip{font-size:11px;margin:0;padding:1px 6px}
.mc .more{font-size:11px;color:var(--muted);padding-left:4px}
.mwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.mhead{display:grid;grid-template-columns:repeat(7,1fr)}

/* agenda */
.agenda{flex:1;overflow-y:auto;padding:6px 22px 20px}
.ag-day{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.ag-day:last-child{border:0}
.ag-date{font-family:var(--display);font-size:20px;line-height:1.1}
.ag-date small{display:block;font-family:var(--font);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ag-day.today .ag-date{color:var(--accent)}
.ag-list{display:flex;flex-direction:column;gap:8px}
.ag-ev{display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border-left:3px solid var(--c);text-align:left;width:100%}
.ag-ev time{font-size:13px;color:var(--muted);width:120px;flex:none}
.ag-ev b{font-weight:600;font-size:15px}
.ag-ev .av{width:24px;height:24px;font-size:11px;margin-left:auto}

/* fab */
.fab{position:absolute;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;display:grid;place-items:center;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--accent) 75%,transparent);z-index:5;transition:.15s}
.fab:active{transform:scale(.93)}

/* aside */
.aside{padding:22px 22px 20px 0;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
@media (max-width:1279px){.app.has-aside{grid-template-columns:84px minmax(0,1fr)}.app .aside{display:none}}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h2{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .ic{font-size:20px;color:var(--accent)}
.later{margin-left:auto;font-family:var(--font);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.music{display:flex;gap:12px;align-items:center}
.art{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
.music b{display:block;font-size:14px}.music p{font-size:12.5px;color:var(--muted)}
.ctrl{display:flex;justify-content:center;gap:12px;margin-top:12px}
.ctrl button{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:20px}
.ctrl button.pl{background:var(--accent);color:var(--on-accent)}
.meal{font-size:14px;line-height:1.4}.meal small{color:var(--muted)}

/* chores */
.chores-wrap{flex:1;overflow-y:auto;min-height:0;padding-bottom:20px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 14px;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--c)}
.col-card h2{font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:10px;padding:0 4px 8px}
.col-card h2 em{margin-left:auto;font-family:var(--font);font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.chore{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface2);text-align:left;width:100%;min-height:62px;transition:.2s}
.chore:active{transform:scale(.98)}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;color:transparent;flex:none;transition:.2s;font-size:17px}
.chore.done .chk{background:var(--c);color:var(--on-accent);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.18)}}
.chore .ci{font-size:22px;color:var(--muted)}
.chore .nm{flex:1;font-size:15.5px;font-weight:500;min-width:0}
.chore .nm small{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.chore.done .nm b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted);font-weight:500}
.chore .av{width:24px;height:24px;font-size:11px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px}
.mrow .ic{font-size:24px;color:var(--accent)}
.mrow b{font-size:15.5px}.mrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.avs{margin-left:auto;display:flex}
.avs .av{width:28px;height:28px;font-size:12px;border:2px solid var(--surface);margin-left:-6px}

/* settings */
.set{flex:1;overflow-y:auto;max-width:760px;padding-bottom:30px}
.sec{margin-bottom:22px}
.sec h3{font-family:var(--display);font-size:20px;margin-bottom:10px;font-weight:600}
.srow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;min-height:64px}
.srow .ic{font-size:24px;color:var(--muted)}
.srow b{font-size:15px}.srow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.srow .seg,.srow .pick{margin-left:auto}
.pick{display:flex;gap:6px}
.pick button{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--muted);display:flex;align-items:center;gap:6px;min-height:38px}
.pick button .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick button.on{background:color-mix(in srgb,var(--c) 26%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--c)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(3px)}
.scrim.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet{width:min(520px,94vw);background:var(--surface);border-radius:26px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:rise .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto}
.sheet h2{font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:16px;display:flex;align-items:center}
.sheet h2 .x{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:20px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none;min-height:48px}
.inp:focus{border-color:var(--accent)}
select.inp{font-size:15px;appearance:none}
.days{display:flex;gap:6px}
.days button{flex:1;padding:8px 0;border-radius:12px;background:var(--surface2);font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;min-height:52px;justify-content:center}
.days button b{font-size:17px;font-family:var(--display);color:var(--ink)}
.days button.on{background:var(--accent);color:var(--on-accent)}.days button.on b{color:var(--on-accent)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.tg{display:flex;align-items:center;gap:10px;font-size:14px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface2);position:relative;transition:.2s;flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:var(--accent)}.sw.on:after{left:23px;background:var(--on-accent)}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;margin-top:6px;min-height:52px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.who{display:flex;gap:12px;justify-content:center;margin:6px 0 4px}
.who button{width:132px;padding:18px 0 14px;border-radius:20px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:15px;position:relative;transition:.15s}
.who button:active{transform:scale(.96)}
.who button .av{width:54px;height:54px;font-size:22px}
.who button.pre{box-shadow:inset 0 0 0 2.5px var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.who button .hint{position:absolute;top:8px;right:10px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sub2{color:var(--muted);font-size:14px;margin:-8px 0 14px}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:12px 12px 12px 20px;border-radius:999px;display:flex;align-items:center;gap:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:color-mix(in srgb,var(--bg) 22%,transparent);padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px}

/* bottom tab bar (phone) */
.tabbar{display:none}
@media (max-width:700px){
  .app,.app.has-aside{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  main{padding:14px 14px 8px}
  h1{font-size:26px}
  .wx span{display:none}
  .seg button{padding:7px 11px;font-size:12.5px}
  .people{gap:8px;overflow-x:auto}
  .person{padding:8px 10px;gap:8px;min-width:150px}
  .cols{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar .nav{width:auto;height:54px;border-radius:14px}
  .tabbar .nav.on{box-shadow:none;background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .fab{right:16px;bottom:16px;width:56px;height:56px}
  .scrim{align-items:flex-end}
  .sheet{width:100%;border-radius:26px 26px 0 0}
  .ag-day{grid-template-columns:70px 1fr}
  .ag-ev time{width:90px;font-size:12px}
  .hide-m{display:none!important}
  .mc .chip{display:none}.mc.has:after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin:2px auto 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

  var title=st.cal==='month'?'November 2026':st.cal==='day'?DOW[dateOf(st.day).getDay()]+', Nov '+dateOf(st.day).getDate():'Nov 3 – 9';
  var sub=st.cal==='month'?'':'2026';
  return '<header><div class="h-title"><button class="circ" data-act="prev">'+ic('caret-left')+'</button><div style="padding:0 8px"><h1>'+title+'</h1><div class="h-sub">Tuesday · 5:16 PM</div></div><button class="circ" data-act="next">'+ic('caret-right')+'</button></div><button class="today-btn" data-act="today">Today</button><div class="spacer"></div><div class="wx">'+ic('cloud-sun','fill')+'<span>36° · Partly cloudy</span></div>'+
   '<div class="seg" id="calseg">'+['week','day','month','agenda'].map(function(v){return '<button data-cal="'+v+'" class="'+(st.cal===v?'on':'')+(v==='agenda'?'':'')+'">'+(v==='agenda'?'Schedule':v[0].toUpperCase()+v.slice(1))+'</button>'}).join('')+'</div></header>'+
   peopleHtml()+'<div class="cal">'+body+'<button class="fab" data-act="add" aria-label="Add event">'+ic('plus','bold')+'</button></div>';
}

/* ---------- chores ---------- */
function choreBtn(c,owner){
  var done=DONE[c.id],k=done||owner||'f';
  var sub=c.mode==='rotating'?'<small>'+ic('swap')+'Rotating · next: '+M[c.who[((c.idx||0)+1)%c.who.length]].n+'</small>':c.mode==='either'&&!done?'<small>'+ic('users')+'Either of us</small>':'<small>'+c.rec+'</small>';
  return '<button class="chore'+(done?' done':'')+'" style="--c:'+M[k].c+'" data-ch="'+c.id+'"><span class="chk">'+ic('check','bold')+'</span><span class="ci">'+ic(c.icon)+'</span><span class="nm"><b>'+c.name+'</b>'+(done&&c.mode==='either'?'<small>Done by '+M[done].n+'</small>':sub)+'</span></button>';
}
function choresView(){
  var h='<header><div class="h-title"><div><h1>Chores</h1><div class="h-sub">Tuesday, Nov 3</div></div></div><div class="spacer"></div><div class="seg"><button data-ct="today" class="'+(st.choreTab==='today'?'on':'')+'">Today</button><button data-ct="manage" class="'+(st.choreTab==='manage'?'on':'')+'">Manage</button></div></header>';
  h+=peopleHtml();
  if(st.choreTab==='today'){
    var cols=['a','b','f'].map(function(k){
      var list=CH.filter(function(c){return k==='f'?(c.mode==='either'&&!DONE[c.id]):(c.mode==='either'?DONE[c.id]===k:assignee(c)===k)});
      var p=k==='f'?null:progress(k);
      return '<div class="col-card" style="--c:'+M[k].c+'"><h2>'+(k==='f'?ic('users','fill')+'Shared':'<span class="av" style="--c:'+M[k].c+'">'+M[k].n[0]+'</span>'+M[k].n)+(p?'<em>'+p.d+' of '+p.n+' done</em>':'<em>anyone can do</em>')+'</h2>'+(list.length?list.map(function(c){return choreBtn(c,k)}).join(''):'<div class="empty">All clear ✓</div>')+'</div>';
    }).join('');
    h+='<div class="chores-wrap"><div class="cols">'+cols+'</div></div>';
  } else {
    h+='<div class="chores-wrap">'+CH.map(function(c){var avs=c.who.map(function(k){return '<span class="av" style="--c:'+M[k].c+'">'+M[k].n[0]+'</span>'}).join('');
      return '<div class="mrow">'+ic(c.icon)+'<div><b>'+c.name+'</b><small>'+c.rec+' · '+(c.mode==='rotating'?'Rotates '+c.who.map(function(k){return M[k].n}).join(' → '):c.mode==='either'?'Either of us':'Fixed: '+M[c.who[0]].n)+'</small></div><div class="avs">'+avs+'</div></div>'}).join('')+'</div>';
  }
  return h;
}

/* ---------- settings ---------- */
function settingsView(){
  var th=[['system','System'],['light','Light'],['dark','Dark']];
  return '<header><div class="h-title"><div><h1>Settings</h1><div class="h-sub">Household · Mara &amp; Theo</div></div></div></header><div class="set">'+
  '<div class="sec"><h3>Appearance</h3><div class="srow">'+ic('sun-horizon')+'<div><b>Theme</b><small>System follows this device</small></div><div class="seg" id="themeseg">'+th.map(function(t){return '<button data-th="'+t[0]+'" class="'+(st.pref===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div></div></div>'+
  '<div class="sec"><h3>Calendars</h3>'+CALS.map(function(c){return '<div class="srow">'+ic('calendar-dots')+'<div><b>'+c.name+'</b><small>'+c.src+' · synced 2 min ago</small></div><div class="pick" data-cal-id="'+c.id+'">'+['a','b','f'].map(function(k){return '<button data-map="'+k+'" style="--c:'+M[k].c+'" class="'+(c.person===k?'on':'')+'"><span class="dot"></span>'+M[k].n+'</button>'}).join('')+'</div></div>'}).join('')+
  '<div class="srow">'+ic('plus')+'<div><b>Add account</b><small>Google or iCloud</small></div></div></div></div>';
}

/* ---------- shell ---------- */
function render(){
  var nav=[['calendar','Calendar','calendar-blank'],['chores','Chores','broom'],['settings','Settings','gear-six']];
  var navHtml=function(){return nav.map(function(n){return '<button class="nav'+(st.view===n[0]?' on':'')+'" data-view="'+n[0]+'">'+ic(n[2],st.view===n[0]?'fill':'regular')+n[1]+'</button>'}).join('')};
  var main=st.view==='calendar'?calView():st.view==='chores'?choresView():settingsView();
  var showAside=st.view==='calendar';
  var aside='<aside class="aside"><div class="card"><h2>'+ic('fork-knife')+'Tonight<span class="later">PantryPal</span></h2><p class="meal">Lemon chicken, roasted veg<br><small>Cook by 6:00 · serves 2</small></p></div><div class="card"><h2>'+ic('music-notes')+'Now playing<span class="later">Spotify</span></h2><div class="music"><div class="art"></div><div><b>Golden Hour</b><p>JVKE</p></div></div><div class="ctrl"><button>'+ic('skip-back','fill')+'</button><button class="pl">'+ic('pause','fill')+'</button><button>'+ic('skip-forward','fill')+'</button></div></div></aside>';
  el('app').className='app'+(showAside?' has-aside':'');
  el('app').innerHTML='<nav class="rail"><div class="logo">H</div>'+navHtml()+'<div class="sp"></div></nav><main>'+main+'</main>'+(showAside?aside:'')+'<nav class="tabbar">'+navHtml()+'</nav>';
  /* keep scroll to now */
  var sc=document.querySelector('.scroll');if(sc)sc.scrollTop=Math.max(0,(NOW-S-3)*H);
}

/* ---------- sheets ---------- */
function openSheet(html){el('sheet').innerHTML=html;el('scrim').classList.add('open')}
function closeSheet(){el('scrim').classList.remove('open')}
var draft;
function addSheet(){
  draft=draft||{day:0,cal:'c1',allday:false,rep:'Does not repeat'};
  var opts=[];for(var h=7;h<=21;h+=.5)opts.push(h);
  var sel=function(id,v){return '<select class="inp" id="'+id+'">'+opts.map(function(h){return '<option value="'+h+'"'+(h===v?' selected':'')+'>'+fmt(h)+'</option>'}).join('')+'</select>'};
  openSheet('<h2>New event<button class="x" data-act="close" aria-label="Close">'+ic('x')+'</button></h2>'+
  '<div class="fld"><input class="inp" id="e-title" placeholder="Title" autocomplete="off"></div>'+
  '<div class="fld"><label>Calendar</label><div class="pick" id="e-cal" style="flex-wrap:wrap">'+CALS.map(function(c){var k=c.person;return '<button data-ecal="'+c.id+'" style="--c:'+M[k].c+'" class="'+(draft.cal===c.id?'on':'')+'"><span class="dot"></span>'+M[k].n+' <span style="opacity:.6;font-weight:500">· '+c.src+'</span></button>'}).join('')+'</div></div>'+
  '<div class="fld"><label>Day</label><div class="days" id="e-days">'+[0,1,2,3,4,5,6].map(function(o){var d=dateOf(o);return '<button data-eday="'+o+'" class="'+(draft.day===o?'on':'')+'">'+DOW[d.getDay()]+'<b>'+d.getDate()+'</b></button>'}).join('')+'</div></div>'+
  '<div class="fld tg"><button class="sw'+(draft.allday?' on':'')+'" id="e-ad" aria-label="All day"></button>All day</div>'+
  '<div class="fld row2" id="e-times" style="'+(draft.allday?'display:none':'')+'"><div><label>Start</label>'+sel('e-s',14)+'</div><div><label>End</label>'+sel('e-e',15)+'</div></div>'+
  '<div class="fld"><label>Repeat</label><select class="inp" id="e-rep"><option>Does not repeat</option><option>Daily</option><option>Weekdays</option><option>Weekly</option><option>Monthly</option><option>Yearly</option></select></div>'+
  '<button class="btn" data-act="save-ev">Add to '+M[personOf(draft.cal)].n+'’s calendar</button>');
  setTimeout(function(){var t=el('e-title');if(t&&innerWidth>700)t.focus()},50);
}
function choreSheet(id){
  var c=CH.filter(function(x){return x.id===id})[0],pre=assignee(c),was=DONE[id];
  if(was){delete DONE[id];render();toast('Marked not done',function(){DONE[id]=was;render()});return}
  openSheet('<h2>'+c.name+'<button class="x" data-act="close" aria-label="Close">'+ic('x')+'</button></h2><p class="sub2">Who did it?</p><div class="who">'+['a','b'].map(function(k){return '<button data-who="'+k+'" data-id="'+id+'" class="'+(pre===k?'pre':'')+'" style="--c:'+M[k].c+'">'+(pre===k?'<span class="hint">assigned</span>':'')+'<span class="av" style="--c:'+M[k].c+'">'+M[k].n[0]+'</span>'+M[k].n+'</button>'}).join('')+'</div>');
}
var tt;
function toast(msg,undo){
  el('toast-msg').textContent=msg;el('toast').classList.add('show');
  el('toast-undo').onclick=function(){undo();el('toast').classList.remove('show')};
  clearTimeout(tt);tt=setTimeout(function(){el('toast').classList.remove('show')},6000);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-view],[data-cal],[data-act],[data-p],[data-ct],[data-th],[data-map],[data-ch],[data-who],[data-ecal],[data-eday],#e-ad,.mc');
  if(e.target===el('scrim')){closeSheet();return}
  if(!t)return;
  if(t.dataset.view){st.view=t.dataset.view;render()}
  else if(t.dataset.cal){st.cal=t.dataset.cal;render()}
  else if(t.dataset.p){st.off[t.dataset.p]=!st.off[t.dataset.p];render()}
  else if(t.dataset.ct){st.choreTab=t.dataset.ct;render()}
  else if(t.dataset.th){st.pref=t.dataset.th;localStorage.setItem('hh-theme',st.pref);applyTheme();render()}
  else if(t.dataset.map){var id=t.parentNode.dataset.calId;CALS.filter(function(c){return c.id===id})[0].person=t.dataset.map;render()}
  else if(t.dataset.ch){choreSheet(+t.dataset.ch)}
  else if(t.dataset.who){var id2=+t.dataset.id;DONE[id2]=t.dataset.who;closeSheet();render();toast(M[t.dataset.who].n+' completed “'+CH.filter(function(c){return c.id===id2})[0].name+'”',function(){delete DONE[id2];render()})}
  else if(t.dataset.ecal){draft.cal=t.dataset.ecal;draft.title=el('e-title').value;addSheet();el('e-title').value=draft.title}
  else if(t.dataset.eday){draft.day=+t.dataset.eday;var tv=el('e-title').value;addSheet();el('e-title').value=tv}
  else if(t.id==='e-ad'){draft.allday=!draft.allday;t.classList.toggle('on');el('e-times').style.display=draft.allday?'none':''}
  else if(t.classList.contains('mc')){st.day=+t.dataset.off>=0&&+t.dataset.off<=6?+t.dataset.off:0;st.cal='day';render()}
  else if(t.dataset.act==='add'){draft=null;addSheet()}
  else if(t.dataset.act==='close'){closeSheet()}
  else if(t.dataset.act==='today'){st.day=0;render()}
  else if(t.dataset.act==='prev'){if(st.cal==='day')st.day=Math.max(0,st.day-1);render()}
  else if(t.dataset.act==='next'){if(st.cal==='day')st.day=Math.min(6,st.day+1);render()}
  else if(t.dataset.act==='save-ev'){
    var title=el('e-title').value.trim()||'New event';
    var s=draft.allday?0:+el('e-s').value,en=draft.allday?0:Math.max(+el('e-e').value,+el('e-s').value+.5);
    if(draft.allday)ALLDAY.push([draft.day,title,draft.cal]);else EV.push([draft.day,s,en,title,draft.cal]);
    closeSheet();st.view='calendar';if(st.cal==='month'||st.cal==='agenda'){}render();toast('Added “'+title+'”',function(){if(draft.allday)ALLDAY.pop();else EV.pop();render()});
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
render();
</script>
</body>
</html>
