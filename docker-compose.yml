services:
  homehub:
    build: .
    image: homehub:latest
    container_name: homehub
    restart: unless-stopped
    ports:
      # Bound to localhost; expose over the tailnet with `tailscale serve --bg 8788`.
      - "127.0.0.1:8788:8788"
    env_file:
      - path: .env
        required: false
    environment:
      HOMEHUB_DATA_DIR: /data
      PORT: "8788"
      HOST: 0.0.0.0
    volumes:
      - ./data:/data
