services:
  telescreen:
    build: .
    image: telescreen:latest
    container_name: telescreen
    restart: unless-stopped
    ports:
      # Bound to localhost; expose over the tailnet with `tailscale serve --bg 8788`.
      - "127.0.0.1:8788:8788"
    env_file:
      - path: .env
        required: false
    environment:
      TELESCREEN_DATA_DIR: /data
      PORT: "8788"
      HOST: 0.0.0.0
      # Provider credentials come from `env_file: .env` above (GOOGLE_*, SPOTIFY_*,
      # PANTRYPAL_*); nothing needs to be repeated here.
    volumes:
      - ./data:/data

# Meals need a route from this container to PantryPal: its tailnet or LAN URL,
# or a shared Docker network joined with an override file:
#
#   # docker-compose.override.yml
#   services:
#     telescreen:
#       networks: [default, shared]
#   networks:
#     shared:
#       name: pantrypal_default
#       external: true
