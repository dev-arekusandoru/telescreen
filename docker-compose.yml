services:
  homehub:
    build: .
    image: homehub:latest
    container_name: homehub
    restart: unless-stopped
    ports:
      # Bound to localhost; expose over the tailnet with `tailscale serve --bg 8788`.
      - "127.0.0.1:8788:8788"
    env_file:
      - path: .env
        required: false
    environment:
      HOMEHUB_DATA_DIR: /data
      PORT: "8788"
      HOST: 0.0.0.0
      # Provider credentials come from `env_file: .env` above (GOOGLE_*, SPOTIFY_*,
      # PANTRYPAL_*); nothing needs to be repeated here.
    volumes:
      - ./data:/data
    networks:
      - default
      - rakazo

# Shared network with the pantrypal/rakazo stacks, which is where `pantrypal`
# resolves. It is owned by rakazo's compose project, so it must exist first:
#   docker network ls | grep -i rakazo
#   docker network create rakazo_app   # only if missing
# Override the name with RAKAZO_NETWORK if it differs.
networks:
  rakazo:
    name: ${RAKAZO_NETWORK:-rakazo_app}
    external: true
